<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Warga - Deteksi Overload Truk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .publik-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 14px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .publik-header-title h1 {
            color: #0f172a;
            font-size: 1.8em;
            margin-bottom: 8px;
        }

        .publik-header-title p {
            color: #475569;
            margin-bottom: 0;
        }

        .publik-header-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #publikUserInfo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
            color: #0f172a;
        }

        .user-badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }


        .publik-container {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .publik-header {
            background: white;
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .publik-header h1 {
            color: #0f172a;
            font-size: 1.8em;
            margin-bottom: 8px;
        }

        .publik-header p {
            color: #475569;
            margin-bottom: 20px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1em;
        }

        .search-bar button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-bar button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            color: #475569;
            font-weight: 600;
            font-size: 0.95em;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: 700;
            color: #0f172a;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .map-card,
        .detail-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .map-card h3,
        .detail-card h3 {
            color: #0f172a;
            margin-bottom: 16px;
        }

        #map {
            width: 100%;
            height: 450px;
            border-radius: 10px;
        }

        .risk-indicator {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .risk-green {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
        }

        .risk-yellow {
            background: #fef3c7;
            border: 1px solid #fde047;
            color: #92400e;
        }

        .risk-red {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #7f1d1d;
        }

        .detail-item {
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #475569;
            font-weight: 600;
            font-size: 0.95em;
        }

        .detail-value {
            color: #0f172a;
            margin-top: 4px;
        }

        .notify-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
        }

        .notify-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .notify-status {
            margin-top: 12px;
            font-size: 0.9em;
            color: #475569;
            text-align: center;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .search-bar {
                flex-direction: column;
            }
        }
</head>
<body>
    <div class="publik-container">
        <div class="publik-header-top">
            <div class="publik-header-title">
                <h1>🚨 Dashboard Warga - Deteksi Overload Truk</h1>
                <p>Periksa keamanan rute Anda dan pantau truk overload di jalan yang sering Anda lewati.</p>
            </div>
            <div class="publik-header-user">
                <div id="publikUserInfo"></div>
                <button class="btn-logout" onclick="logoutUser()">Logout</button>
            </div>
        </div>

        <div id="publikContent">
            <div class="publik-header">
                <h1>🚨 Dashboard Warga - Deteksi Overload Truk</h1>
                <p>Periksa keamanan rute Anda dan pantau truk overload di jalan yang sering Anda lewati.</p>
                <div class="search-bar">
                    <input type="text" id="routeSearch" placeholder="Cari nama jalan atau rute Anda (Contoh: Cipularang, Tol Cawang)">
                    <button onclick="searchRoute()">Periksa Rute</button>
                </div>
            </div>

            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-label">Total Truk Diperiksa</div>
                    <div class="stat-value" id="statTotal">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Truk Overload Hari Ini</div>
                    <div class="stat-value" id="statOverload">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Persentase Overload</div>
                    <div class="stat-value" id="statPercent">0%</div>
                </div>
            </div>

            <div class="main-content">
                <div class="map-card">
                    <h3>🗺️ Peta Rute</h3>
                    <div id="map"></div>
                </div>

                <div class="detail-card">
                    <h3>📊 Detail Rute</h3>
                    <div id="riskIndicator" class="risk-indicator" style="display: none;"></div>
                    <div id="routeDetails">
                        <p style="color: #475569; text-align: center;">Masukkan nama rute untuk melihat detail keamanan</p>
                    </div>
                    <button class="notify-btn" id="notifyBtn" style="display: none;" onclick="handleNotificationRequest()">
                        🔔 Langganan Notifikasi
                    </button>
                    <div id="notifyStatus" class="notify-status"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="auth.js"></script>
    <script>
        const VEHICLE_DATA_KEY = 'vehicleData';
        const NOTIFICATION_KEY = 'publikNotificationEnabled';
        const SUBSCRIBED_ROUTE_KEY = 'publikSubscribedRoute';

        let map;
        let routeLayer;
        let currentRouteData = null;
        let notificationSubscribed = false;

        // Mock routes database
        const ROUTES = [
            {
                name: 'Cipularang',
                coordinates: [[-6.85, 107.45], [-6.95, 107.55]],
                description: 'Jalan Tol Cipularang'
            },
            {
                name: 'Tol Cawang',
                coordinates: [[-6.20, 106.80], [-6.22, 106.85]],
                description: 'Tol Jagorawi - Cawang'
            },
            {
                name: 'Narogong',
                coordinates: [[-6.30, 107.00], [-6.35, 107.05]],
                description: 'Jalan Raya Narogong'
            },
            {
                name: 'Serpong',
                coordinates: [[-6.30, 106.65], [-6.32, 106.70]],
                description: 'Jalan Serpong - Bintaro'
            }
        ];

        function initPublikDashboard() {
            updateStatistics();
            initMap();
            notificationSubscribed = localStorage.getItem(NOTIFICATION_KEY) === 'true';
            updateNotificationStatus();
            setInterval(updateStatistics, 10000);
            setInterval(monitorVehicleData, 5000);
        }

        function initMap() {
            if (map) {
                map.remove();
            }
            map = L.map('map').setView([-6.21, 106.84], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
        }

        function updateStatistics() {
            const data = getVehicleData();
            const total = data.length;
            const overload = data.filter(v => v.status === 'overload').length;
            const percent = total === 0 ? 0 : Math.round((overload / total) * 100);

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statOverload').textContent = overload;
            document.getElementById('statPercent').textContent = `${percent}%`;
        }

        function searchRoute() {
            const query = document.getElementById('routeSearch').value.trim().toLowerCase();
            if (!query) {
                alert('Masukkan nama rute yang ingin diperiksa');
                return;
            }

            const route = ROUTES.find(r => r.name.toLowerCase().includes(query));
            if (!route) {
                alert('Rute tidak ditemukan. Coba: Cipularang, Tol Cawang, Narogong, atau Serpong');
                return;
            }

            analyzeRoute(route);
        }

        function analyzeRoute(route) {
            const data = getVehicleData();
            const overloadCount = data.filter(v => v.status === 'overload').length;
            const totalCount = data.length;
            const riskPercent = totalCount === 0 ? 0 : Math.round((overloadCount / totalCount) * 100);

            let riskLevel, riskColor, riskText;
            if (riskPercent < 30) {
                riskLevel = 'hijau';
                riskColor = 'risk-green';
                riskText = `✅ AMAN - ${riskPercent}% truk overload (< 30%)`;
            } else if (riskPercent < 70) {
                riskLevel = 'kuning';
                riskColor = 'risk-yellow';
                riskText = `⚠️ WASPADA - ${riskPercent}% truk overload (30-70%)`;
            } else {
                riskLevel = 'merah';
                riskColor = 'risk-red';
                riskText = `🚨 BAHAYA - ${riskPercent}% truk overload (> 70%)`;
            }

            currentRouteData = {
                route,
                riskLevel,
                riskPercent,
                overloadCount,
                totalCount
            };

            // Update peta
            if (routeLayer) {
                map.removeLayer(routeLayer);
            }
            const routeColor = riskLevel === 'hijau' ? '#16a34a' : riskLevel === 'kuning' ? '#eab308' : '#dc2626';
            routeLayer = L.polyline(route.coordinates, {
                color: routeColor,
                weight: 5,
                opacity: 0.9
            }).addTo(map);
            map.fitBounds(routeLayer.getBounds().pad(0.1));

            // Update detail card
            document.getElementById('riskIndicator').innerHTML = `<strong>${riskText}</strong>`;
            document.getElementById('riskIndicator').className = `risk-indicator ${riskColor}`;
            document.getElementById('riskIndicator').style.display = 'block';

            const detailsHTML = `
                <div class="detail-item">
                    <div class="detail-label">Nama Rute</div>
                    <div class="detail-value">${route.name} - ${route.description}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Total Truk Melewati Rute</div>
                    <div class="detail-value">${totalCount} truk</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Truk Overload</div>
                    <div class="detail-value">${overloadCount} truk</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Level Risiko</div>
                    <div class="detail-value">${riskLevel.toUpperCase()}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Rekomendasi</div>
                    <div class="detail-value">${
                        riskLevel === 'merah'
                            ? '⛔ Hindari rute ini atau gunakan rute alternatif'
                            : riskLevel === 'kuning'
                            ? '📍 Hati-hati, ada beberapa truk overload'
                            : '✅ Rute aman untuk dilalui'
                    }</div>
                </div>
            `;
            document.getElementById('routeDetails').innerHTML = detailsHTML;
            document.getElementById('notifyBtn').style.display = 'block';
            localStorage.setItem(SUBSCRIBED_ROUTE_KEY, route.name);
        }

        function handleNotificationRequest() {
            if (!('Notification' in window)) {
                alert('Browser Anda tidak mendukung notifikasi');
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    notificationSubscribed = true;
                    localStorage.setItem(NOTIFICATION_KEY, 'true');
                    updateNotificationStatus();
                    showPopupNotification('Berhasil', 'Anda sekarang berlangganan update rute ini');
                } else {
                    notificationSubscribed = false;
                    localStorage.removeItem(NOTIFICATION_KEY);
                    updateNotificationStatus();
                    alert('Izin notifikasi tidak diberikan');
                }
            });
        }

        function updateNotificationStatus() {
            const statusText = document.getElementById('notifyStatus');
            if (!('Notification' in window)) {
                statusText.textContent = 'Notifikasi tidak tersedia di browser ini';
                return;
            }
            if (notificationSubscribed && Notification.permission === 'granted') {
                statusText.textContent = '✅ Notifikasi aktif - Anda akan menerima alert ketika ada overload baru';
            } else if (notificationSubscribed && Notification.permission === 'denied') {
                statusText.textContent = '❌ Notifikasi diblokir - Ubah izin di pengaturan browser';
            } else {
                statusText.textContent = '';
            }
        }

        function monitorVehicleData() {
            if (!currentRouteData || !notificationSubscribed) {
                return;
            }

            const data = getVehicleData();
            const newOverloadCount = data.filter(v => v.status === 'overload').length;

            if (newOverloadCount > currentRouteData.overloadCount) {
                const newCount = newOverloadCount - currentRouteData.overloadCount;
                const routeName = currentRouteData.route.name;
                showPopupNotification(
                    'Truk Overload Baru!',
                    `${newCount} truk overload baru terdeteksi di rute ${routeName}`
                );
                currentRouteData.overloadCount = newOverloadCount;
            }
        }

        function showPopupNotification(title, message) {
            try {
                new Notification(title, {
                    body: message,
                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="red"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>'
                });
            } catch (err) {
                console.warn('Notifikasi popup gagal:', err);
            }
        }

        function getVehicleData() {
            const raw = localStorage.getItem(VEHICLE_DATA_KEY);
            if (!raw) return [];
            try {
                const data = JSON.parse(raw);
                return Array.isArray(data) ? data : [];
            } catch (err) {
                return [];
            }
        }

        // Update user info for publik
        function updatePublikUserInfo() {
            const user = getCurrentUser();
            const userInfoEl = document.getElementById('publikUserInfo');
            
            if (userInfoEl && user.type === 'publik') {
                userInfoEl.innerHTML = `
                    <span class="user-badge">👥 Masyarakat Umum</span>
                    <span class="user-email">${user.email}</span>
                `;
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth('publik');
            updatePublikUserInfo();
            initPublikDashboard();
        });
    </script>
</body>
</html>
